---
- name: Prepare the VM
  hosts: all
  gather_facts: false
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    
  tasks:
    - name: Generate random Vagrant password
      set_fact:
        random_vagrant_password: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

    - name: Change Vagrant password
      ansible.builtin.user:
        name: vagrant
        password: "{{ random_vagrant_password | password_hash('sha512', lookup('password', '/dev/null length=8 chars=ascii_letters,digits')) }}"
      become_user: root

    - name: Change root password      
      ansible.builtin.user:
        name: root
        password: "{{ random_vagrant_password | password_hash('sha512', lookup('password', '/dev/null length=8 chars=ascii_letters,digits')) }}"
      become_user: root

    - name: Print Vagrant password to log
      ansible.builtin.debug:
        msg: "Vagrant Password: {{ random_vagrant_password }}"
    - name: Create resolver configuration directory
      become: true
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Configure DNS resolver
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/99-dns.conf
        mode: "0644"
        content: |
          [Resolve]
          DNS=
          DNS=10.10.0.1
          Domains=~.
          DNSSEC=no
      register: resolver_config

    - name: Apply resolver configuration
      become: true
      ansible.builtin.systemd:
        name: systemd-resolved
        enabled: true
        state: "{{ 'restarted' if resolver_config.changed else 'started' }}"

    - name: Test DNS resolution
      ansible.builtin.command: getent ahostsv4 www.google.com
      register: dns_test
      changed_when: false
      retries: 3
      delay: 5
      until: dns_test.rc == 0

    - name: Test HTTPS connectivity
      ansible.builtin.uri:
        url: https://www.google.com
        method: GET
        status_code: 200
        timeout: 20
      register: connectivity_test
      retries: 3
      delay: 5
      until: connectivity_test is succeeded

    - name: Show connectivity results
      ansible.builtin.debug:
        msg:
          - "DNS: {{ dns_test.stdout_lines }}"
          - "HTTPS status: {{ connectivity_test.status }}"


    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: yes      

    - name: Install basic packages in the VM
      ansible.builtin.apt:
        name:
          - net-tools
        state: present
      become: true
