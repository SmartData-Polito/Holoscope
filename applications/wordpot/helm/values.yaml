# values.yaml
global:
  namespace: wordpot

# Image tag — overridden at deploy time with git SHA
image_tag: latest
wordpot:
  image:
    repository: registry.local:5000/public/wordpot
    pullPolicy: IfNotPresent
  
  # Container configuration
  container:
    name: wordpot
    httpPort: 80
    httpsPort: 443
  
  # Service configuration
  service:
    type: NodePort
    httpPort: 80
    httpsPort: 443
  
  # Resource limits
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  
  # Storage for wordpot logs
  persistence:
    enabled: true
    type: "hostPath"
    storageClass: "manual"
    size: 1Gi
